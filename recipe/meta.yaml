{% set name = "pkld" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pkld-{{ version }}.tar.gz
  sha256: ee5a14daa49d3ba6b988702bfacc1932856123328cd10ce1fafed16500a5a253

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - filelock

test:
  imports:
    - pkld
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/shobrook/pkld
  summary: Persistent caching for Python functions
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - paulcbogdan
